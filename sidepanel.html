<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>now Flow v8.2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  background: #0f0f0f; color: #e0e0e0;
  overflow: hidden;
}

/* 상태바 */
#status-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; background: #1a1a1a; border-bottom: 1px solid #333;
  font-size: 11px; color: #aaa;
}
#status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #555; margin-right: 6px; display: inline-block;
}
#status-dot.connected { background: #4caf50; }
#status-dot.running   { background: #ff9800; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* 헤더 */
#header {
  padding: 10px 14px 6px;
  background: linear-gradient(135deg, #1e1e2e, #2a1a3e);
  border-bottom: 1px solid #333;
}
#header h1 { font-size: 16px; font-weight: 700; color: #a78bfa; }
#header p  { font-size: 11px; color: #888; margin-top: 2px; }

/* 탭바 */
#tab-bar {
  display: flex; background: #1a1a1a; border-bottom: 1px solid #333;
  overflow-x: auto;
}
.tab-btn {
  flex: 1; padding: 8px 4px; font-size: 11px; background: none;
  border: none; color: #888; cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; transition: all .2s;
}
.tab-btn.active { color: #a78bfa; border-bottom-color: #a78bfa; }
.tab-btn:hover  { color: #ccc; }

/* 탭 패널 */
.tab-panel { display: none; height: calc(100vh - 132px); overflow-y: auto; padding: 10px 12px; }
.tab-panel.active { display: block; }

/* 공통 섹션 */
.section { margin-bottom: 14px; }
.section-title {
  font-size: 11px; color: #888; margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: .5px;
}

/* 프롬프트 */
#prompt-input {
  width: 100%; height: 110px; background: #1e1e1e; border: 1px solid #444;
  color: #e0e0e0; border-radius: 6px; padding: 8px; font-size: 12px;
  resize: vertical; font-family: inherit;
}
#prompt-input:focus { outline: none; border-color: #a78bfa; }

/* ── Feature2: 씬 카드 ──────────────────────────────────────── */
.scene-card {
  background: #1e1e2e; border: 1px solid #333; border-radius: 8px;
  padding: 10px; margin-bottom: 8px; transition: all .25s;
}
.scene-card:hover  { border-color: #6d5acd; }

/* Feature2: 작업 중 씬 강조 */
.scene-card.active {
  border-color: #a78bfa;
  background: #251e3e;
  box-shadow: 0 0 0 2px rgba(167,139,250,.25);
}
/* Feature2: 완료된 씬 */
.scene-card.done {
  border-color: #4caf50;
  background: #1a2a1a;
}

.scene-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.scene-name   { font-size: 12px; font-weight: 600; color: #c4b5fd; }
.scene-status { font-size: 10px; color: #666; }
.scene-card.active .scene-status { color: #ff9800; font-weight: 600; }
.scene-card.done   .scene-status { color: #4caf50; font-weight: 600; }

/* ── Feature2: Dot UI ───────────────────────────────────────── */
/* dot-row: 라벨 + dot 가로 배열 */
.dot-row {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px; margin-top: 8px;
}
/* dot 그룹 (라벨 + 원) */
.dot-group {
  display: flex; align-items: center; gap: 3px;
}
.dot-label {
  font-size: 9px; color: #666; white-space: nowrap;
}
/* dot 원 */
.dot {
  width: 12px; height: 12px; border-radius: 50%; background: #333;
  transition: background .3s, transform .2s; cursor: default; flex-shrink: 0;
}
.dot[title] { cursor: help; }
.dot.pending { background: #3a3a3a; }
.dot.running { background: #ff9800; animation: blink .8s infinite; transform: scale(1.15); }
.dot.done    { background: #4caf50; }
.dot.error   { background: #f44336; }
/* 테두리로 타입 구분 */
.dot.char { border: 2px solid #a78bfa; }
.dot.bg   { border: 2px solid #64b5f6; }
.dot.full { border: 2px solid #81c784; }

/* 캐릭터 입력 */
.char-row { display: flex; gap: 6px; margin-bottom: 6px; }
#char-input {
  flex: 1; background: #1e1e1e; border: 1px solid #444; color: #e0e0e0;
  border-radius: 6px; padding: 6px 8px; font-size: 12px;
}
#char-input:focus { outline: none; border-color: #a78bfa; }

/* Feature1: 추가 버튼 명확한 스타일 */
#btn-add-char {
  flex: 0 0 auto; padding: 6px 14px;
  background: #2a1a3e; border: 1px solid #a78bfa;
  color: #c4b5fd; border-radius: 6px; font-size: 12px;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
#btn-add-char:hover  { background: #3a2a4e; }
#btn-add-char:active { background: #4a3a5e; }

.char-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: #2a1a3e; border: 1px solid #a78bfa; border-radius: 12px;
  padding: 2px 8px; font-size: 11px; color: #c4b5fd; margin: 2px;
}
.char-tag .remove { cursor: pointer; color: #888; font-size: 10px; }
.char-tag .remove:hover { color: #f44336; }

/* 컨트롤 버튼 */
.ctrl-btns {
  display: flex; flex-direction: row; gap: 6px;
  padding: 10px 12px; background: #1a1a1a;
  border-top: 1px solid #333; position: sticky; bottom: 0;
}
.ctrl-btn {
  flex: 1; padding: 9px 4px; border: none; border-radius: 8px;
  font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s;
}
#btn-start { background: #a78bfa; color: #fff; }
#btn-start:hover:not(:disabled) { background: #8b5cf6; }
#btn-pause { background: #2a2a3e; color: #a78bfa; border: 1px solid #a78bfa; }
#btn-stop  { background: #2a1a1a; color: #f87171; border: 1px solid #f87171; }
#btn-reset { background: #1a2a1a; color: #86efac; border: 1px solid #86efac; }
.ctrl-btn:disabled { opacity: .4; cursor: not-allowed; }

/* 프로그레스 바 */
#progress-wrap { padding: 5px 12px; background: #1a1a1a; }
#progress-bar-bg {
  width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden;
}
#progress-bar { height: 100%; background: #a78bfa; border-radius: 3px; width: 0%; transition: width .3s; }
#progress-text { font-size: 10px; color: #888; text-align: right; margin-top: 2px; }

/* 설정 */
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.setting-label { font-size: 12px; color: #ccc; }
.setting-control { flex: 0 0 auto; }
.setting-control input[type="text"],
.setting-control input[type="number"],
.setting-control select {
  background: #1e1e1e; border: 1px solid #444; color: #e0e0e0;
  border-radius: 6px; padding: 4px 8px; font-size: 12px; width: 120px;
}
.setting-control input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

/* 로그 */
#log-area {
  font-family: monospace; font-size: 11px; color: #aaa;
  background: #111; padding: 8px; border-radius: 6px;
  height: 200px; overflow-y: auto;
}
.log-line       { padding: 1px 0; }
.log-line.error   { color: #f87171; }
.log-line.success { color: #86efac; }
.log-line.info    { color: #93c5fd; }

/* 체크리스트 */
.check-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid #222; font-size: 11px;
}
.check-item .ci-icon { font-size: 13px; flex-shrink: 0; }
.check-item.pass         .ci-icon::before { content: '✅'; }
.check-item.fail         .ci-icon::before { content: '❌'; }
.check-item.pending-check .ci-icon::before { content: '⏳'; }
.check-item .ci-text      { color: #ccc; }
.check-item.pass .ci-text { color: #86efac; }
.check-item.fail .ci-text { color: #f87171; }

/* CSV */
#btn-csv {
  width: 100%; padding: 8px; background: #1a2a1a; border: 1px solid #86efac;
  border-radius: 8px; color: #86efac; font-size: 12px; cursor: pointer;
  margin-top: 8px; transition: all .2s;
}
#btn-csv:hover { background: #223322; }

/* 파싱 버튼 */
#btn-parse {
  width: 100%; padding: 8px; background: #1e1a2e;
  border: 1px solid #a78bfa; border-radius: 8px;
  color: #c4b5fd; font-size: 12px; cursor: pointer; transition: all .2s;
}
#btn-parse:hover { background: #2a2040; }

/* 스크롤바 */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

/* Feature4: 자동 배정 뱃지 */
.auto-badge {
  display: inline-block; font-size: 9px; padding: 1px 5px;
  background: #1a3a1a; border: 1px solid #4caf50; border-radius: 8px;
  color: #86efac; margin-left: 4px; vertical-align: middle;
}

/* Feature2: 씬 미리보기 카드 (프롬프트 탭) */
.preview-card {
  background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 6px;
  padding: 8px 10px; margin-bottom: 6px;
}
.preview-card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px;
}
</style>
</head>
<body>

<!-- 상태바 -->
<div id="status-bar">
  <div style="display:flex;align-items:center">
    <span id="status-dot"></span>
    <span id="status-text">연결 대기 중...</span>
  </div>
  <span id="status-count">0 / 0</span>
</div>

<!-- 헤더 -->
<div id="header">
  <h1>⚡ now Flow</h1>
  <p>Google Flow AI 이미지 자동 저장 v8.2</p>
</div>

<!-- 탭바 -->
<div id="tab-bar">
  <button class="tab-btn active" data-tab="prompt">📝 프롬프트</button>
  <button class="tab-btn" data-tab="scenes">🎬 씬</button>
  <button class="tab-btn" data-tab="settings">⚙️ 설정</button>
  <button class="tab-btn" data-tab="log">📋 로그</button>
  <button class="tab-btn" data-tab="checklist">✅ 체크</button>
</div>

<!-- 프로그레스 바 -->
<div id="progress-wrap">
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>
  <div id="progress-text">0 / 0 에셋</div>
</div>

<!-- ── 탭: 프롬프트 ───────────────────────────────────────────── -->
<div class="tab-panel active" id="tab-prompt">

  <div class="section">
    <div class="section-title">씬 프롬프트 입력</div>
    <!-- Feature4: input 이벤트로 자동 파싱 트리거 -->
    <textarea id="prompt-input"
      placeholder="씬 프롬프트를 입력하세요...&#10;여러 씬: '씬1:', '씬2:' 또는 'Scene1:' 으로 구분&#10;&#10;예시:&#10;씬1: 프롬프트: 엘리와 제이가 공원에서 만나는 장면&#10;씬2: 프롬프트: 실험실 내부, 네온 조명"></textarea>
  </div>

  <div class="section">
    <div class="section-title">등록 캐릭터</div>
    <!-- Feature1: 캐릭터 추가 버튼 -->
    <div class="char-row">
      <input id="char-input" type="text" placeholder="캐릭터 이름 입력 후 Enter 또는 추가">
      <button id="btn-add-char">+ 추가</button>
    </div>
    <div id="char-tags"></div>
  </div>

  <div class="section">
    <button id="btn-parse">🔍 씬 파싱 &amp; 캐릭터 자동 배정</button>
  </div>

  <!-- Feature2: 씬 미리보기 (파싱 후 표시) -->
  <div class="section" id="scene-preview-section" style="display:none">
    <div class="section-title">파싱된 씬 미리보기</div>
    <div id="scene-preview"></div>
  </div>

  <button id="btn-csv">📊 CSV 내보내기</button>
</div>

<!-- ── 탭: 씬 ────────────────────────────────────────────────── -->
<div class="tab-panel" id="tab-scenes">
  <div class="section">
    <div class="section-title">씬 목록 <span id="scene-count" style="color:#a78bfa"></span></div>
    <!-- Feature2: 씬 카드 + Dot UI 렌더링 영역 -->
    <div id="scene-list"></div>
  </div>
</div>

<!-- ── 탭: 설정 ──────────────────────────────────────────────── -->
<div class="tab-panel" id="tab-settings">
  <div class="section">
    <div class="section-title">생성 설정</div>
    <div class="setting-row">
      <span class="setting-label">모델</span>
      <div class="setting-control">
        <select id="set-model">
          <option value="imagen-3">Imagen 3</option>
          <option value="imagen-3-fast">Imagen 3 Fast</option>
          <option value="flow-1">Flow 1</option>
        </select>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">비율</span>
      <div class="setting-control">
        <select id="set-ratio">
          <option value="16:9">16:9</option>
          <option value="9:16">9:16</option>
          <option value="1:1">1:1</option>
          <option value="4:3">4:3</option>
        </select>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">생성 수</span>
      <div class="setting-control">
        <input type="number" id="set-count" value="1" min="1" max="4" style="width:60px">
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">동시 처리</span>
      <div class="setting-control">
        <input type="number" id="set-concurrency" value="1" min="1" max="3" style="width:60px">
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">재시도 횟수</span>
      <div class="setting-control">
        <input type="number" id="set-retries" value="2" min="0" max="5" style="width:60px">
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">대기 시간(ms)</span>
      <div class="setting-control">
        <input type="number" id="set-delay" value="3000" min="1000" max="15000" style="width:80px">
      </div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">저장 설정</div>
    <div class="setting-row">
      <span class="setting-label">자동 다운로드</span>
      <div class="setting-control">
        <input type="checkbox" id="set-auto-download" checked>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">파일 접두사</span>
      <div class="setting-control">
        <input type="text" id="set-prefix" value="TF_" style="width:80px">
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">폴더명</span>
      <div class="setting-control">
        <input type="text" id="set-folder" value="Google_Flow_Saved">
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">언어</span>
      <div class="setting-control">
        <select id="set-lang">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- ── 탭: 로그 ──────────────────────────────────────────────── -->
<div class="tab-panel" id="tab-log">
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div class="section-title" style="margin:0">실행 로그</div>
      <button id="btn-clear-log"
        style="font-size:10px;background:#2a1a1a;border:1px solid #555;color:#aaa;border-radius:4px;padding:2px 8px;cursor:pointer;">
        지우기
      </button>
    </div>
    <div id="log-area"></div>
  </div>
</div>

<!-- ── 탭: 체크리스트 ───────────────────────────────────────── -->
<div class="tab-panel" id="tab-checklist">
  <div class="section">
    <div class="section-title">5가지 핵심 기능 + 12가지 과제 검증</div>
    <div id="checklist-area"></div>
    <button id="btn-run-checklist"
      style="width:100%;margin-top:8px;padding:8px;background:#1e1a2e;border:1px solid #a78bfa;
             border-radius:8px;color:#c4b5fd;font-size:12px;cursor:pointer;">
      🔍 체크리스트 실행
    </button>
  </div>
</div>

<!-- ── 컨트롤 버튼 ──────────────────────────────────────────── -->
<div class="ctrl-btns">
  <button class="ctrl-btn" id="btn-start">▶ 시작</button>
  <button class="ctrl-btn" id="btn-pause" disabled>⏸ 일시정지</button>
  <button class="ctrl-btn" id="btn-stop"  disabled>⏹ 정지</button>
  <button class="ctrl-btn" id="btn-reset">🔄 리셋</button>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
